<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"><link rel="stylesheet" href="capture.css"><link rel="stylesheet" href="window.css"><link rel="stylesheet" href="qingjian.css"><title>Obsidian 桌面采集 · 清笺</title></head><body>
<main class="capture">
<header aria-label="拖动小窗">
 <div class="mode-seg" role="navigation" aria-label="视图切换">
  <button type="button" class="seg-btn is-active" aria-current="page">速记</button>
  <button type="button" class="seg-btn switch-graph">任务图</button>
 </div>
 <div class="actions">
  <button type="button" class="recent-toggle top-pill" aria-expanded="false" title="查看最近未消化活记录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>最近</span><span class="count">0</span></button>
  <button type="button" class="palette-toggle icon" aria-label="切换配色主题" title="切换配色主题" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r="1" fill="currentColor"/><circle cx="17.5" cy="10.5" r="1" fill="currentColor"/><circle cx="8.5" cy="7.5" r="1" fill="currentColor"/><circle cx="6.5" cy="12.5" r="1" fill="currentColor"/><path d="M12 2a10 10 0 1 0 10 10c0-1.9-1.5-3-3.2-3h-1.8a2 2 0 0 1-2-2v-.8C15 4.4 13.8 2 12 2Z"/></svg></button>
  <button type="button" class="pin icon" aria-label="保存后继续打开" title="保存后继续打开" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M5 17h14l-4-5V5l2-2H7l2 2v7z"/></svg></button>
  <button type="button" class="menu icon" aria-label="更多选项" title="更多选项"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
  <button type="button" class="close icon" aria-label="收起并保留草稿" title="收起并保留草稿"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
 </div>
</header>
<div class="draft-bar" aria-label="多草稿切换">
 <button type="button" class="new-draft" title="新建空白草稿 (Ctrl+N)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>新草稿</span></button>
 <span class="draft-sep" aria-hidden="true"></span>
 <div class="draft-tabs" role="tablist" aria-label="当前草稿列表"></div>
</div>
<aside class="palette-popover" role="dialog" aria-label="选择配色主题" hidden></aside>
<section class="recent" role="dialog" aria-label="最近未消化记录" hidden></section>
<section class="editor-area">
 <textarea class="body" aria-label="记录正文" placeholder="写下此刻的念头，不用急着想分类…"></textarea>
 <div class="drawer-stack">
  <div class="attachments" aria-label="附件"></div>
  <div class="extra">
   <label class="date-block" hidden><span>任务日期（可选）</span><input class="due" type="date"></label>
   <label class="tags-block" hidden><span>检索标签（1–3 个）</span><input class="tags" placeholder="例如：学习方法 实验"></label>
  </div>
  <div class="source-block" hidden><label><span>来源</span><input class="source" placeholder="链接、书名或页码"></label></div>
  <div class="thought-block" hidden><label><span>我的想法</span><textarea class="thought" placeholder="留下它的原因…"></textarea></label></div>
 </div>
</section>
<footer>
 <div class="footer-tools" aria-label="分类与补充">
  <select class="type-select chip-select" aria-label="记录类型"><option value="note">[~] 随手记</option><option value="diary">日记</option><option value="task">[!] 任务</option><option value="issue">[?] 问题</option><option value="idea">[I] 想法</option><option value="link">[L] 链接</option></select>
  <select class="project-select chip-select" aria-label="归属项目" title="可选挂载 #项目/简称"><option value="">#项目</option></select>
  <button type="button" class="add-source ghost-chip" aria-expanded="false" title="补充出处链接">来源</button>
  <button type="button" class="add-thought ghost-chip" aria-expanded="false" title="补充个人理解">想法</button>
  <button type="button" class="add-file ghost-chip" title="添加图片或文档附件">附件</button>
  <button type="button" class="copy-ai ghost-chip" title="连同项目标签复制，直接粘贴给桌面 AI 讨论">复制给AI</button>
 </div>
 <div class="footer-right">
  <button type="button" class="sync-status" aria-label="连接状态；点击重试待写入记录"><span class="sync-dot" aria-hidden="true"></span><span class="sync-text">连接中</span></button>
  <span class="destination sr-only">当天 Daily</span>
  <small class="draft-status sr-only" role="status">空白记录</small>
  <button type="button" class="save">写入<span>Ctrl↵</span></button>
 </div>
</footer>
<div class="notice" role="status" aria-live="polite"></div>
</main><script src="capture.js"></script></body></html>
